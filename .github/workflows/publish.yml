name: Publish Docker Images

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
          - name: backend
            context: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" frontend/package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Newest commit subject (image label)
        id: sub
        run: echo "subject=$(git log -1 --pretty=%s | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wine-cellar-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.description=${{ steps.sub.outputs.subject }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # One GitHub pre-release per push to main: notes = commits since the previous build release,
  # so the page linked from update messages tells what changed in the image.
  release-notes:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create build release with notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          TAG="build-$(date -u +%Y%m%d-%H%M)-$SHORT"
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="$(git rev-list -n1 "$PREV")..$GITHUB_SHA"
          else
            RANGE="-n 15 $GITHUB_SHA"
          fi
          TITLE="$(git log -1 --pretty=%s)"
          {
            echo "## What's new"
            echo
            git log --reverse --no-merges --pretty=format:'### %s (`%h`)%n%n%b%n' $RANGE \
              | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo
            echo "## Images"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/wine-cellar-backend:edge\` (also \`:sha-$SHORT\`)"
            echo "- \`ghcr.io/${{ github.repository_owner }}/wine-cellar-frontend:edge\` (also \`:sha-$SHORT\`)"
            if [ -n "$PREV" ]; then
              echo
              echo "Full diff: https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
            fi
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes-file notes.md
