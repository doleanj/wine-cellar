<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <!-- The app has its own EN/DE switch; browser translation would freeze text the app updates -->
    <meta name="google" content="notranslate" />
    <link rel="icon" href="%sveltekit.assets%/logo/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/logo/wine-cellar-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/logo/wine-cellar-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7B1D3F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wine Cellar" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wine Cellar</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
  </body>
</html>
